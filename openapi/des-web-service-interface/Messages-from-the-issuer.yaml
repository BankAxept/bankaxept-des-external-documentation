openapi: 3.0.3
info:
  title: BankAxept - Issuer - DES Web Service Interface
  description: This is a technical specification of the Web Service Application Programming
    Interface (API) for the BankAxept Digital Enablement Service (DES) to issuer interface.
  version: "1.10"
servers:
  - url: https://[bax.main.server]/des/api/issuer/v1
paths:
  /healthCheck:
    get:
      tags:
        - issuer-to-des
      summary: Check if DES is healthy
      description: The issuer may use the optional HealthCheck API call to verify
        the availability of the DES. **Note:** This message is a HTTP GET.
      operationId: healthCheck
      parameters:
        - name: tid
          in: header
          description: Trace Identifier following the request.
          schema:
            type: string
      responses:
        200:
          description: successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheckResponse'
  /inquiry:
    post:
      tags:
        - issuer-to-des
      summary: Token information inquiry
      description: |-
        The Inquiry API call provides the issuer with the ability to search for token-related information. BankAxept supports inquiry calls with different inputs:  
        *  **Search by the primary account number (PAN)**: the response provides information for all tokens associated with the PAN.  
        *  **Search by the token**: the response provides information on the specific token.  
        *  **Search by tokenReferenceId and tokenRequestorId**: the response provides information of the token associated with the combination of the tokenReferenceId and tokenRequestorId.  
        *  **Search by the issuerCardRefId**: the response provides information for all tokens associated with the card instance.  
        
        *If tokenReferenceId is used for the inquiry, tokenRequestorId must also be included, and vice versa.*
      operationId: inquiry
      parameters:
        - name: tid
          in: header
          description: Trace Identifier following the request.
          schema:
            type: string
        - $ref: '#/components/parameters/IssuerID'
      requestBody:
        description: Request for token inquiry.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InquiryRequest'
        required: true
      responses:
        200:
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InquiryResponse'
      x-codegen-request-body-name: body
  /replaceCard:
    post:
      tags:
        - issuer-to-des
      summary: Replace funding card details
      description: |-
        The ReplaceCard call is used by the issuer to update card PAN mapping information for all tokens that are associated to a PAN. 
        *encryptedNewCardPan* field contains the Base64-encoded encrypted card PAN.
      operationId: replaceCard
      parameters:
        - name: tid
          in: header
          description: Trace Identifier following the request.
          schema:
            type: string
        - $ref: '#/components/parameters/IssuerID'
      requestBody:
        description: Request for replacing card details.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceCardRequest'
        required: true
      responses:
        200:
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplaceCardResponse'
  /updateCardState:
    post:
      tags:
        - issuer-to-des
      summary: Request token status update
      description: |-
        UpdateCardState is used by the issuer to request the DES to make a change to the token status. The change can be made on all tokens associated with the same PAN at once, or only on a specific token depending on the input data.  
        
        **Note:** When a PAN is suspended (issuerCardRefId), all tokens associated to the PAN are suspended. To resume tokens, the request needs to specify the specific token (tokenReferenceId and token-RequestorId or token).  
        
        The DES also supports batch card state updates via this API. In such a case, the updateCardDe-tailsList can contain up to 99 individual records.  
        
        BankAxept supports UpdateCardState calls with different inputs:  
        *  **Update by token**: the response provides information on the updated token.  
        *  **Update by tokenReferenceId and tokenRequestorId**: the response provides information on the updated token associated with the combination of the tokenReferenceId and token-RequestorId.  
        *  **Update by the issuerCardRefId**: the response provides information for all updated tokens associated with the card instance. Note: Update by the issuerCardRefId does not apply for resume.  
        
        If no token information is included, all the tokens associated with the card will be updated. If either (token) or (tokenRequestorId and tokenReferenceId) is included, only the specific token will be updated.  
        
        **Note**: When a PAN is suspended (issuerCardRefId), all tokens associated to the PAN are suspended. To resume tokens the request needs to specify the specific token (tokenReferenceId).
      operationId: updateCardState
      parameters:
        - name: tid
          in: header
          description: Trace Identifier following the request.
          schema:
            type: string
        - $ref: '#/components/parameters/IssuerID'
      requestBody:
        description: Request for updating token status.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCardStateRequest'
        required: true
      responses:
        200:
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateCardStateResponse'
components:
  schemas:
    BaseResponse:
      type: object
      required:
        - responseCode
      properties:
        responseCode:
          type: integer
          description: Response code
        errorMessage:
          maxLength: 500
          type: string
          description: Error message in case the response is not OK.
    DeviceInformation:
      required:
        - tokenStorageId
        - tokenStorageType
      type: object
      properties:
        tokenStorageId:
          maxLength: 128
          type: string
          description: A unique device identifier.
        tokenStorageType:
          type: string
          description: Identify the type token storage location type.
          enum:
            - WALLET_SERVER
            - PHONE
            - TABLET
            - WATCH
            - COMPUTER
            - UNKNOWN
    Expiry:
      maxLength: 4
      minLength: 4
      pattern: ^(0[1-9]|1[0-2])(\d{2})$
      type: string
      description: Expiry date in MMYY format
    HealthCheckResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
    InquiryDetails:
      required:
        - accountPanSuffix
        - expiryDate
        - panSequenceNumber
        - tokenDetailsList
      type: object
      properties:
        accountPanSuffix:
          maxLength: 4
          minLength: 4
          type: string
          description: Last four digits of the card fpan.
        expiryDate:
          $ref: '#/components/schemas/Expiry'
        panSequenceNumber:
          pattern: ^0\d{2}$
          type: string
          description: The card sequence number.
        tokenDetailsList:
          type: array
          description: Detailed information of the token(s).
          items:
            $ref: '#/components/schemas/TokenDetails'
    InquiryRequest:
      type: object
      required:
        - issuerId
      properties:
        encryptedCardPan:
          type: string
          description: Base64-encoded string of encrypted funding PAN (fpan). When
            this data presents, the response will return all tokens associated to
            this fpan.
        issuerCardRefId:
          maxLength: 48
          type: string
          description: A unique identifier for a BankAxept card instance.
        issuerId:
          maxLength: 10
          type: string
          description: Unique identifier of the issuer.
        keyIndex:
          maxLength: 500
          type: string
          description: An identifier of the key (the fingerprint of the certificate)
            used to encrypt data between the DES and the Issuer.
        token:
          maxLength: 19
          type: string
          description: Deprecated. Use encryptedToken instead.Unencrypted token value, When
            this data is used for the inquiry, the response will return information for the specific token.
          deprecated: true
        encryptedToken:
          type: string
          description: Base64-encoded string of encrypted token PAN (tpan). When
            this data is used for the inquiry, the response will return information for the
            specific token.
        tokenReferenceId:
          maxLength: 32
          type: string
          description: A unique identifier of the token.
        tokenRequestorId:
          maxLength: 11
          type: string
          description: A unique identifier of the token requestor.
    InquiryResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          required:
            - inquiryDetailsList
          properties:
            inquiryDetailsList:
              type: array
              description: Detailed information of cards and tokens.
              items:
                $ref: '#/components/schemas/InquiryDetails'
    ReplaceCardDetails:
      required:
        - issuerCardRefId
        - encryptedNewCardPan
        - newCardExpiryDate
        - newCardSequenceNumber
      type: object
      properties:
        encryptedNewCardPan:
          type: string
          description: The new card PAN.
        issuerCardRefId:
          maxLength: 48
          type: string
          description: A unique identifier for a BankAxept card instance.
        newCardExpiryDate:
          $ref: '#/components/schemas/Expiry'
        newCardSequenceNumber:
          pattern: ^0\d{2}$
          type: string
          description: The new card sequence number.
    ReplaceCardRequest:
      type: object
      required:
        - issuerId
        - keyIndex
      properties:
        issuerId:
          maxLength: 10
          type: string
          description: Unique identifier of the issuer.
        keyIndex:
          maxLength: 500
          type: string
          description: An identifier of the key (the fingerprint of the certificate)
            used to encrypt data between the DES and the Issuer.
        replaceCardDetails:
          $ref: '#/components/schemas/ReplaceCardDetails'
        replaceCardDetailsList:
          deprecated: true
          maxItems: 99
          type: array
          description: >
            **Deprecated** — use `replaceCardDetails` instead.  
            Details of the card to be replaced and the new card information.  
            If more than one card is to be replaced (batch replacement), one record  
            per card must be provided.
          items:
            $ref: '#/components/schemas/ReplaceCardDetails'
      oneOf:
        - required:
            - replaceCardDetails
        - required:
            - replaceCardDetailsList
    ReplaceCardResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            responseDetailsLcm:
              $ref: '#/components/schemas/ResponseDetailsLcm'
            responseDetailsLcmList:
              deprecated: true
              type: array
              description: >
                **Deprecated** — `responseDetailsLcm` will be sent in response instead.  
                Result(s) of the replacement action. If more than one card  
                is to be replaced, one result per card will be returned.
              items:
                $ref: '#/components/schemas/ResponseDetailsLcm'
        - oneOf:
            - required:
                - responseDetailsLcm
            - required:
                - responseDetailsLcmList
    ResponseDetailsLcm:
      required:
        - issuerCardRefId
        - numberOfTokensUpdated
        - responseCode
        - tokenInfoList
      type: object
      properties:
        errorMessage:
          maxLength: 500
          type: string
          description: Error message in case the response is not OK.
        issuerCardRefId:
          maxLength: 48
          type: string
          description: A unique identifier for a card instance.
        numberOfTokensUpdated:
          type: integer
          description: The total number of tokens that have been updated.
        responseCode:
          type: integer
          description: Response code.
        tokenInfoList:
          type: array
          description: List of tokens updated.
          items:
            $ref: '#/components/schemas/TokenInfo'
    TokenDetails:
      required:
        - tokenAssuranceLevel
        - tokenExpiryDate
        - tokenReferenceId
        - tokenRequestorId
        - tokenStatus
        - tokenType
        - keyIndex
      type: object
      properties:
        deviceInformation:
          $ref: '#/components/schemas/DeviceInformation'
        token:
          maxLength: 19
          type: string
          deprecated: true
          description: The token value.
        encryptedToken:
          type: string
          description: Base64-encoded string of encrypted token PAN (tpan).
        tokenActivationTime:
          maxLength: 19
          minLength: 19
          type: string
          description: The exact date and time when the token is activated. The format
            is according to ISO 8601. YYYY-MM-DDThh:mm:ss  The field is Conditional
            and only applicable if the token has been activated.
        tokenExpiryDate:
          $ref: '#/components/schemas/Expiry'
        tokenReferenceId:
          maxLength: 32
          type: string
          description: A unique identifier of the token.
        tokenRequestorId:
          maxLength: 11
          type: string
          description: A unique identifier of the token requestor.
        tokenStatus:
          type: string
          enum:
            - CREATED
            - PROVISIONED
            - ACTIVE
            - SUSPENDED
            - DELETED
        tokenType:
          type: string
          description: |-
            “EMBEDDED_SE” used for international wallets based on Secure Element (SE).  
            
            “HCE” used for international wallets based on Host Card Emulation (HCE).  
            
            “CARD_ON_FILE” used for ePayment.
          enum:
            - EMBEDDED_SE
            - HCE
            - CARD_ON_FILE
        keyIndex:
          maxLength: 500
          type: string
          description: An identifier of the key (the fingerprint of the certificate)
            used to encrypt data between the DES and the Issuer.
    TokenInfo:
      required:
        - tokenReferenceId
        - tokenRequestorId
      type: object
      properties:
        tokenReferenceId:
          maxLength: 32
          type: string
          description: A unique identifier of the token.
        tokenRequestorId:
          maxLength: 11
          type: string
          description: A unique identifier of the token requestor.
    UpdateCardDetails:
      required:
        - action
        - requestReason
      type: object
      properties:
        action:
          type: string
          enum:
            - SUSPEND
            - RESUME
            - DELETE
        issuerCardRefId:
          maxLength: 48
          type: string
          description: A unique identifier for a BankAxept card instance.
        requestReason:
          type: integer
          description: |-
            Description provided by the issuer regarding the reason of specific lifecycle management action. Allowed values are:  
            * 11 => User decision  
            * 21 => Issuer decision  
            * 31 => Device lost  
            * 32 => Device stolen  
            * 131 => Device recovered  
            * 41 => DES decision
        token:
          maxLength: 19
          type: string
          description: Deprecated. Use encryptedToken instead.When
            this data is used for the inquiry, the response will return information for the
            specific token.
          deprecated: true
        encryptedToken:
          type: string
          description: Base64-encoded string of encrypted token PAN (tpan).
        tokenReferenceId:
          maxLength: 32
          type: string
          description: A unique identifier of the token.
        tokenRequestorId:
          maxLength: 11
          type: string
          description: A unique identifier of the token requestor.
    UpdateCardStateRequest:
      type: object
      required:
        - issuerId
      properties:
        issuerId:
          maxLength: 10
          type: string
          description: Unique identifier of the issuer.
        updateCardDetails:
          $ref: '#/components/schemas/UpdateCardDetails'
        updateCardDetailsList:
          deprecated: true
          maxItems: 99
          type: array
          description: >
            **Deprecated** — use `UpdateCardDetails` instead.  
            List of UpdateCardDetails records.
          items:
            $ref: '#/components/schemas/UpdateCardDetails'
      oneOf:
        - required:
            - updateCardDetails
        - required:
            - updateCardDetailsList
    UpdateCardStateResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          required:
            - processId
          properties:
            responseDetailsLcm:
              $ref: '#/components/schemas/ResponseDetailsLcm'
            responseDetailsLcmList:
              deprecated: true
              type: array
              description: The details of the state update actions.
              items:
                $ref: '#/components/schemas/ResponseDetailsLcm'
            processId:
              maxLength: 48
              type: string
              description: Process identifier
        - oneOf:
            - required:
                - responseDetailsLcm
            - required:
                - responseDetailsLcmList
  parameters:
    IssuerID:
      name: issuer-id
      in: header
      description: Issuer Identifier for the request. Is the same as in the request body.
      schema:
        type: string
        maxLength: 10
